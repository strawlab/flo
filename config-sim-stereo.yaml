# Hardware-free STEREO simulation config for FLO.
#
# This config runs the embedded FLO camera host with simulated cameras and no
# motor hardware. Drive it with `floz-replay-inprocess synth`, which projects a
# virtual-insect trajectory through this same calibration:
#
#   STRAND_CAM_SIM_SPEC=sim-cameras.toml \
#     floz-replay-inprocess synth --config config-sim-stereo.yaml \
#       --distance 3 --distance-amplitude 1 -- --config config-sim-stereo.yaml
#
# Notes:
#   * The `sim` backend will not start without STRAND_CAM_SIM_SPEC pointing at
#     a scenario; `sim-cameras.toml` in this directory is one.
#   * That backend names its cameras `simcam0`, `simcam1`, ..., so the
#     `camera_name` values below have to be those. `floz-replay-inprocess`
#     reads them from here and attributes its synthetic centroids to the same
#     cameras, so nothing has to be repeated on the command line.
#   * ImOps is disabled because the in-process source supplies the centroids.
# Config schema version. Version 2 means kalman_filter_parameters holds
# RMS values; version 1 (or a missing field) meant variances and is
# auto-converted on load with a warning.
config_version: 2
geometry: MovingCamera
pwm_output_enabled: false
kalman_filter_parameters:
  # Pan/tilt filter. Both values are RMS (root-mean-square), as for
  # kalman_filter_dist_parameters; kalman_step squares them.
  #
  # RMS of the unknown random angular acceleration [rad/s^2].
  # Was 1000.0 when this field held a variance [rad^2/s^3].
  motion_noise: 31.622776601683793
  # RMS of the angular measurement noise [rad].
  # Was 0.0001 when this field held a variance [rad^2].
  observation_noise: 0.01
control_loop_timestep_secs: 0.001
kp_pan_angle: 0.0
kp_tilt_angle: 0.0
ki_pan_angle:  20.0
ki_tilt_angle:  15.0
centroid_to_sensor_x_angle_func:
# needs to be adjusted to specific camera/lens combination
  dx_gain: 0.00035 # 5.6 um / 16mm    (px pitch / focal length)
  dy_gain: 0.0
  offset: 0.0
centroid_to_sensor_y_angle_func:
  dx_gain: 0.0
  dy_gain: -0.00035 # same here, minus sign due to mounting
  offset: 0.0
pan_motor_config:
  endpoint_low: -1.5708
  endpoint_high: 1.5708
  neutral_position: 0.0
tilt_motor_config:
  endpoint_low: -0.7854
  endpoint_high: 0.5
  neutral_position: 0.0
pan_pwm_config:
  low_value: 700.0
  high_value: 2600.0
tilt_pwm_config:
  low_value: 1200.0
  high_value: 2000.0
tracking_thresholds:
  # how long to keep tracking the lost animal with estimated velocity,
  # before switching to SuspendedClosedLoop (staring at the last observation)
  msecs_to_suspend: 1000
  # how long to stay in SuspendedClosedLoop before centering
  msecs_to_acquire_lock: 30000
motor_timeconstant_secs: .001
flo-strand-cam:
  main:
    backend: sim
    camera_name: simcam0
    # Matches `fps` in sim-cameras.toml. This is what converts the pre-capture
    # window from seconds into the camera's post-trigger buffer size.
    expected_fps: 100.0
    imops:
      enabled: false
      threshold: 200
      center_x: 960
      center_y: 600
  secondary:
    backend: sim
    camera_name: simcam1
    expected_fps: 100.0
    imops:
      enabled: false
      threshold: 200
      center_x: 960
      center_y: 600
# Stereopsis calibration: distance r (m) maps to the main-vs-stereo x disparity
# (px) as disparity = x_offset(r). These are example values; `floz-replay synth`
# inverts exactly this model, so recovered distance matches the requested range.
stereopsis_calib:
  r1_m: 2.0
  x_offset_1_px: 20.0
  r2_m: 5.0
  x_offset_2_px: 10.0
  pixel_size_um: 3.4
