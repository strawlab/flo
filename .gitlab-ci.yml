flo-tilta-dongle:
  image: rust
  script:
    # Build firmware
    - cd firmware/flo-tilta-dongle
    - rustup target install thumbv7em-none-eabihf
    - cargo build --release

pwm-motor-types:
  image: rust
  script:
    - export RUSTFLAGS="-D warnings"

    - rustup target install thumbv6m-none-eabi

    - cd crates/pwm-motor-types
    # Ensure that it builds without std
    - cargo build --target thumbv6m-none-eabi
    - cargo test

flo-strand-cam:
  image: rust
  script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y libudev-dev libclang-dev librust-alsa-sys-dev

    - export RUSTFLAGS="-D warnings"

    # Install trunk for building the web UI (this assumes x86_64)
    - curl --location --remote-name https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-musl.tar.gz
    - tar xzf trunk-x86_64-unknown-linux-musl.tar.gz
    - mv trunk $CARGO_HOME/bin/
    - trunk --version
    - rustup target add wasm32-unknown-unknown

    # The subsequent check builds in offline mode, so make sure we are ready for that.
    - cargo build --release --workspace

    - ./build.sh

    - cargo test --workspace --all-targets
    - cargo run --release -p flo-strand-cam -- --config config-byo.yaml show-config
    - cargo run --release -p flo-strand-cam -- --config config-mini.yaml show-config

    - cd ${CI_PROJECT_DIR}
    - cp target/release/flo-strand-cam flo-strand-cam.${CI_COMMIT_SHA}
  artifacts:
    paths:
      - flo-strand-cam.${CI_COMMIT_SHA}
    name: "flo-strand-cam.${CI_COMMIT_SHA}"

test-crates:
  image: rust
  script:
    - export RUSTFLAGS="-D warnings"

    - cd crates/flo-core
    - cargo test
    - cd ../..

    - cd crates/osd-utils
    - cargo test
    - cd ../..

simplebgc:
  image: rust
  script:
    - export RUSTFLAGS="-D warnings"

    - cd crates/simplebgc
    - cargo test

trinamic:
  image: rust
  script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y libudev-dev

    - export RUSTFLAGS="-D warnings"

    - cd crates/trinamic
    - cargo test
