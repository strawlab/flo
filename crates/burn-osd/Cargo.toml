[package]
name = "burn-osd"
version = "0.1.0"
edition = "2024"
description = "Burn OSD contained in sidecar SRT file onto new video file."

[dependencies]
serde.workspace = true
serde_json.workspace = true
clap = { workspace = true, features = ["derive"] }
eyre.workspace = true
chrono.workspace = true
indicatif.workspace = true
camino.workspace = true
tracing.workspace = true
tracing-panic.workspace = true
tracing-subscriber.workspace = true
image.workspace = true
machine-vision-formats.workspace = true

strand-dynamic-frame = { workspace = true, features = ["convert-image"] }
frame-source = { workspace = true, features = ["openh264"] }
ffmpeg-rewriter.workspace = true
ffmpeg-writer.workspace = true

osd-utils.workspace = true
osd-overlay.workspace = true
