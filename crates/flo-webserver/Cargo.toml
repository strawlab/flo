[package]
name = "flo-webserver"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing.workspace = true
eyre.workspace = true
tokio = { workspace = true, features = ["net", "sync", "rt-multi-thread"] }
http.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
axum.workspace = true
axum-token-auth = "0.3.0"
camino = { workspace = true, optional = true }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["trace", "fs"] }
preferences-serde1.workspace = true
cookie = "0.18.0"
base64.workspace = true
futures-util = "0.3.30"
qrcodegen = "1.8.0"
tower-serve-static = { version = "0.1", optional = true }
include_dir = { version = "0.7.3", optional = true }

strand-bui-backend-session.workspace = true
strand-bui-backend-session-types.workspace = true

flo-core.workspace = true
futures.workspace = true

[features]
default = ["bundle_files"]

# Serve style
## Bundle files into executable
bundle_files = ["tower-serve-static", "include_dir"]
## Serve files from disk at runtime
serve_files = ["camino"]
