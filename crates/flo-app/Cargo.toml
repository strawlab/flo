[package]
name = "flo-app"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "In-process FLO and Strand Camera application"

[lib]
path = "src/lib.rs"

# The executable is `flo`, not `flo-app`: this is the sole FLO application now
# that the standalone `flo` binary is gone, and earlier releases installed it
# under that name. `crates/flo` is a library, so the name does not collide.
[[bin]]
name = "flo"
path = "src/main.rs"

[dependencies]
color-eyre.workspace = true
chrono.workspace = true
serde.workspace = true
serde_yaml.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "sync", "time"] }
tracing.workspace = true
axum.workspace = true

machine-vision-formats.workspace = true

ci2.workspace = true
ci2-async.workspace = true
ci2-pylon.workspace = true
ci2-sim.workspace = true
ci2-vimba.workspace = true
ci2-webcam.workspace = true

camshow-protocol.workspace = true
flo.workspace = true
flo-core.workspace = true
flo-imops.workspace = true
strand-cam.workspace = true
strand-cam-remote-control.workspace = true
strand-dynamic-frame = { workspace = true, features = ["convert-image"] }
strand-http-video-streaming-types.workspace = true

[features]
default = ["bundle_files"]

bundle_files = ["strand-cam/bundle_files", "flo/bundle_files"]
serve_files = ["strand-cam/serve_files", "flo/serve_files"]
