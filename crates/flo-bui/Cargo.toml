[package]
name = "flo-bui"
version = "0.1.0"
authors = ["Andrew Straw <strawman@astraw.com>"]
edition = "2024"

[dependencies]
yew = { version = "0.22.0", features = ["csr"] }
js-sys = "0.3"
gloo-timers = "0.3.0"
gloo-events = "0.2.0"
gloo-utils = "0.2.0"
wasm-bindgen = "0.2.58"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
log.workspace = true
wasm-logger = "0.2.0"
chrono = { workspace = true, features = ["clock", "std", "wasmbind"] }

serde_json.workspace = true
serde_yaml.workspace = true
serde_path_to_error = "0.1.16"

yew-tincture = "0.3"

ads-webasm.workspace = true
strand-cam-bui-components.workspace = true

flo-core.workspace = true

[dependencies.web-sys]
version = "0.3.72"
features = [
    "DomRect",
    "DomTokenList",
    "Element",
    "Event",
    "EventSource",
    "Gamepad",
    "GamepadButton",
    "GamepadEvent",
    "Headers",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlImageElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "MessageEvent",
    "Navigator",
    "Request",
    "RequestCache",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
]
