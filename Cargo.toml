[workspace]
resolver = "3"
members = [
  "crates/burn-osd",
  "crates/camshow",
  "crates/camshow-protocol",
  "crates/flo-app",
  "crates/flo-bui",
  "crates/flo-core",
  "crates/flo-imops",
  "crates/flo",
  "crates/flo-mavlink",
  "crates/flo-mavlink/mavlink-dump",
  "crates/flo-tracing",
  "crates/flo-webserver",
  "crates/floz-cli",
  "crates/floz-parser",
  "crates/floz-repack",
  "crates/floz-replay",
  "crates/floz-retrack",
  "crates/floz-viewer",
  "crates/floz-writer",
  "crates/h264-recorder",
  "crates/h264-recorder/h264-recorder-cli",
  "crates/h264-rtp",
  "crates/osd-displayport",
  "crates/osd-overlay",
  "crates/osd-utils",
  "crates/platform-uuid",
  "crates/pwm-motor-types",
  "crates/rtp-h264-streamer",
  "crates/sbgc-gimbal",
  "crates/simplebgc",
  "crates/simplebgc-derive",
  "crates/tilta-dongle-comms",
  "crates/tokio-mavlink",
  "crates/trinamic",
]
exclude = [
  "firmware/beamdriver",
  "firmware/flo-tilta-dongle",
  "firmware/rpipico-pantilt",
]

[workspace.dependencies]
adskalman = { version = "0.18", default-features = false }
approx = "0.5"
axum = "0.8.1"
bytes = "1"
cam-geom = "0.17"
camino = { version = "1.1.12", features = ["serde1"] }
chrono = { version = "0.4.38", default-features = false }
clap = "4.0.10"
color-eyre = "0.6.3"
csv = "1.3.0"
enumflags2 = "0.7.7"
eyre = "0.6.12"
futures = "0.3.30"
h264-reader = "0.8.0"
http = "1"
home = "0.5.4"
if-addrs = "0.14"
image = { version = "0.25", default-features = false }
indicatif = "0.18"
gloo-file = "0.2"
log = "0.4.17"
wasm-logger = "0.2.0"
yew = { version = "0.22.0", features = ["csr"] }
machine-vision-formats = "0.1.5"
mavlink = { version = "0.12.2", default-features = false }
multiwii_serial_protocol_v2 = "0.1.12"
nalgebra = { version = "0.35", default-features = false }
num-derive = "0.4.2"
num-traits = "0.2.19"
opencv-ros-camera = { version = "0.17", features = ["serde-serialize"] }
openh264 = "0.9.7"
percent-encoding = "2.3"
preferences-serde1 = "2.0.0"
rand = "0.9"
rtp-rs = "0.6"
serde = { version = "1.0.79", default-features = false }
serde_json = "1.0.116"
serde_yaml = "0.9.14"
serde_cbor = "0.11.1"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-serial = { package = "kioto-serial", version = "0.1.2" }
tokio-stream = "0.1.15"
tokio-util = "0.7.4"
tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.16", features = ["env-filter", "time"] }
tracing-panic = "0.1.1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
flate2 = { version = "1.0", default-features = false, features = ["zlib-rs"] }
zip = { version = "2.2.2", default-features = false, features = ["deflate", "time"] }
# The same y4m fork strand-braid's y4m-writer builds against; a second, distinct
# y4m version would make `y4m::Colorspace` values from this crate unusable in
# `y4m_writer::encode_y4m_dynamic_frame`.
y4m = { git = "https://github.com/astraw/y4m", rev = "6992473b73838c84cb659387b21d2ab2ebe94766" }

camshow-protocol = { path = "crates/camshow-protocol" }
flo = { path = "crates/flo", default-features = false }
flo-app = { path = "crates/flo-app" }
flo-core = { path = "crates/flo-core", default-features = false }
flo-imops = { path = "crates/flo-imops" }
flo-tracing = { path = "crates/flo-tracing" }
osd-overlay = { path = "crates/osd-overlay" }
flo-mavlink = { path = "crates/flo-mavlink" }
floz-parser = { path = "crates/floz-parser" }
floz-writer = { path = "crates/floz-writer" }
h264-recorder = { path = "crates/h264-recorder" }
h264-rtp = { path = "crates/h264-rtp" }
osd-displayport = { path = "crates/osd-displayport" }
osd-utils = { path = "crates/osd-utils" }
pwm-motor-types = { path = "crates/pwm-motor-types" }
rtp-h264-streamer = { path = "crates/rtp-h264-streamer" }
simplebgc = { path = "crates/simplebgc" }
simplebgc-derive = { path = "crates/simplebgc-derive" }
tokio-mavlink = { path = "crates/tokio-mavlink" }

ads-webasm = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
bg-movie-writer = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
build-util = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
ci2 = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
ci2-async = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
ci2-pylon = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
ci2-sim = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
ci2-vimba = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
ci2-webcam = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
download-verify = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
ffmpeg-rewriter = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
ffmpeg-writer = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
frame-source = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
imops = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
srt-writer = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
strand-bui-backend-session = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
strand-bui-backend-session-types = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
strand-cam = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704", default-features = false }
strand-cam-bui-components = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
strand-cam-remote-control = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
strand-cam-storetype = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
strand-dynamic-frame = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
strand-http-video-streaming-types = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
y4m-writer = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
zip-or-dir = { git = "https://github.com/strawlab/strand-braid", rev = "9c0f6f261df4179472e436adfa14b522573c6704" }
