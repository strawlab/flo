[workspace]
resolver = "3"
members = [
  "crates/burn-osd",
  "crates/camshow",
  "crates/camshow-protocol",
  "crates/flo-bui",
  "crates/flo-core",
  "crates/flo-mavlink",
  "crates/flo-tracing",
  "crates/flo-mavlink/mavlink-dump",
  "crates/flo-webserver",
  "crates/h264-recorder",
  "crates/h264-recorder/h264-recorder-cli",
  "crates/osd-displayport",
  "crates/osd-overlay",
  "crates/osd-utils",
  "crates/platform-uuid",
  "crates/pwm-motor-types",
  "crates/sbgc-gimbal",
  "crates/simplebgc",
  "crates/simplebgc-derive",
  "crates/tilta-dongle-comms",
  "crates/tokio-mavlink",
  "crates/trinamic", "crates/floz-parser",
  "crates/floz-viewer",
]
exclude = [
  "firmware/beamdriver",
  "firmware/flo-tilta-dongle",
  "firmware/rpipico-pantilt",
]

[package]
name = "flo"
version = "0.1.0"
edition = "2024"
authors = [
  "Andrew Straw <strawman@astraw.com>",
  "Victor V. Titov <vv.titov@gmail.com>",
  "Stephan Lochner <lochner@bio.uni-freiburg.de>",
]
description = "method for videography using a camera system that automatically moves to follow the subject"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "flo"
path = "src/main.rs"

[dependencies]
color-eyre.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
bytes.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["macros", "net", "sync", "time"] }
tokio-util = { workspace = true, features = ["net", "codec", "time"] }
tokio-serial.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
preferences-serde1.workspace = true
cookie_store = "0.21.0"
clap = { workspace = true, features = ["derive"] }
memchr = "2.5.0"
sha2 = "0.10.6"
rand = "0.8.5"
chrono = { workspace = true, default-features = true, features = ["serde"] }
zip = { version = "2.2.2", default-features = false, features = ["time"] }
walkdir = "2.2"
csv.workspace = true
home.workspace = true
iana-time-zone = "0.1.57"
rodio = { version = "0.20", default-features = false, features = [
  "wav",
  "vorbis",
] }
flo-tracing.workspace = true
hyper = "1.1"
tempfile = "3"
tracing.workspace = true
serde_cbor = "0.11.1"
packed_struct = "0.3" # required by multiwii_serial_protocol_v2 0.1.12
glob = "0.3.1"
regex = "1.10.5"
http-body-util = "0.1.0"
axum.workspace = true
camino.workspace = true
nalgebra.workspace = true
adskalman.workspace = true
json-lines = { version = "0.1.1", features = ["codec"] }

multiwii_serial_protocol_v2.workspace = true

camshow-protocol.workspace = true
flo-core.workspace = true
flo-mavlink.workspace = true
flo-webserver = { path = "crates/flo-webserver", default-features = false }
h264-recorder.workspace = true
osd-displayport.workspace = true
osd-utils.workspace = true
platform-uuid = { path = "crates/platform-uuid" }
sbgc-gimbal = { path = "crates/sbgc-gimbal" }
tilta-dongle-comms = { path = "crates/tilta-dongle-comms" }
trinamic = { path = "crates/trinamic" }

strand-bui-backend-session-types.workspace = true
strand-bui-backend-session.workspace = true
strand-cam-remote-control.workspace = true
strand-cam-storetype.workspace = true

# for rodio: if "error: could not find system library 'alsa' required by the 'alsa-sys' crate":
# sudo apt install librust-alsa-sys-dev

[dev-dependencies]
floz-parser.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
ansi_term = "0.12.1"

[workspace.dependencies]
adskalman = { version = "0.17", default-features = false }
axum = "0.8.1"
bytes = "1"
cam-geom = "0.16"
camino = { version = "1.1.12", features = ["serde1"] }
chrono = { version = "0.4.38", default-features = false }
clap = "4.0.10"
color-eyre = "0.6.3"
csv = "1.3.0"
enumflags2 = "0.7.7"
eyre = "0.6.12"
futures = "0.3.30"
http = "1"
home = "0.5.4"
if-addrs = "0.14"
image = { version = "0.25", default-features = false }
indicatif = "0.18"
gloo-file = "0.2"
log = "0.4.17"
wasm-logger = "0.2.0"
yew = { version = "0.22.0", features = ["csr"] }
machine-vision-formats = "0.1.5"
mavlink = { version = "0.17", default-features = false }
multiwii_serial_protocol_v2 = "0.1.12"
nalgebra = { version = "0.34", default-features = false }
num-derive = "0.4.2"
num-traits = "0.2.19"
opencv-ros-camera = { version = "0.16", features = ["serde-serialize"] }
preferences-serde1 = "2.0.0"
serde = { version = "1.0.79", default-features = false }
serde_json = "1.0.116"
serde_yaml = "0.9.14"
thiserror = "2"
tokio = "1"
tokio-serial = { package = "kioto-serial", version = "0.1.2" }
tokio-stream = "0.1.15"
tokio-util = "0.7.4"
tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.16", features = ["env-filter", "time"] }
tracing-panic = "0.1.1"
base64 = "0.22"
flate2 = "1.0"

camshow-protocol = { path = "crates/camshow-protocol" }
flo-core = { path = "crates/flo-core", default-features = false }
flo-tracing = { path = "crates/flo-tracing" }
osd-overlay = { path = "crates/osd-overlay" }
flo-mavlink = { path = "crates/flo-mavlink" }
floz-parser = { path = "crates/floz-parser" }
h264-recorder = { path = "crates/h264-recorder" }
osd-displayport = { path = "crates/osd-displayport" }
osd-utils = { path = "crates/osd-utils" }
pwm-motor-types = { path = "crates/pwm-motor-types" }
simplebgc = { path = "crates/simplebgc" }
simplebgc-derive = { path = "crates/simplebgc-derive" }
tokio-mavlink = { path = "crates/tokio-mavlink" }

bg-movie-writer = { git = "https://github.com/strawlab/strand-braid", rev = "5e9d3b9ac39cecc5328ffd71890f321c9c1addce" }
download-verify = { git = "https://github.com/strawlab/strand-braid", rev = "5e9d3b9ac39cecc5328ffd71890f321c9c1addce" }
ffmpeg-rewriter = { git = "https://github.com/strawlab/strand-braid", rev = "5e9d3b9ac39cecc5328ffd71890f321c9c1addce" }
ffmpeg-writer = { git = "https://github.com/strawlab/strand-braid", rev = "5e9d3b9ac39cecc5328ffd71890f321c9c1addce" }
frame-source = { git = "https://github.com/strawlab/strand-braid", rev = "5e9d3b9ac39cecc5328ffd71890f321c9c1addce" }
srt-writer = { git = "https://github.com/strawlab/strand-braid", rev = "5e9d3b9ac39cecc5328ffd71890f321c9c1addce" }
strand-bui-backend-session = { git = "https://github.com/strawlab/strand-braid", rev = "5e9d3b9ac39cecc5328ffd71890f321c9c1addce" }
strand-bui-backend-session-types = { git = "https://github.com/strawlab/strand-braid", rev = "5e9d3b9ac39cecc5328ffd71890f321c9c1addce" }
strand-cam-remote-control = { git = "https://github.com/strawlab/strand-braid", rev = "5e9d3b9ac39cecc5328ffd71890f321c9c1addce" }
strand-cam-storetype = { git = "https://github.com/strawlab/strand-braid", rev = "5e9d3b9ac39cecc5328ffd71890f321c9c1addce" }
strand-dynamic-frame = { git = "https://github.com/strawlab/strand-braid", rev = "5e9d3b9ac39cecc5328ffd71890f321c9c1addce" }
ads-webasm  = { git = "https://github.com/strawlab/strand-braid", rev = "5e9d3b9ac39cecc5328ffd71890f321c9c1addce" }
zip-or-dir  = { git = "https://github.com/strawlab/strand-braid", rev = "5e9d3b9ac39cecc5328ffd71890f321c9c1addce" }

[features]
default = ["bundle_files"]

# Serve style
## Bundle files into executable
bundle_files = ["flo-webserver/bundle_files"]
## Serve files from disk at runtime
serve_files = ["flo-webserver/serve_files"]
